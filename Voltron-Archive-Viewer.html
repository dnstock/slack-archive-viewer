<input id="fileInput" type="file" accept=".json,application/json" multiple hidden><div id="dropOverlay" hidden>Drop JSON archives here</div><dialog id="modal"><div class="modalHeader"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="Close">✕</button></div><div id="modalBody"></div></dialog><script type="module">const timestampCompare=(a,b)=>{const [ai,af='']=a.split('.'),[bi,bf='']=b.split('.');return ai.length-bi.length||ai.localeCompare(bi)||af.padEnd(12,'0').localeCompare(bf.padEnd(12,'0'))};
function validateArchive(a){
 const fail=s=>{throw Error(s)};
 if(!a||typeof a!=='object'||Array.isArray(a))fail('Expected an archive object.');
 if(a.schema_version!=='1.0.0')fail('Unsupported schema_version. Expected 1.0.0. See About for the format.');
 if(typeof a.archive_id!=='string'||!a.archive_id||!Number.isFinite(Date.parse(a.exported_at)))fail('Missing archive_id or valid exported_at.');
 if(a.workspace?.id!=='T8PPK7S5V'||a.channel?.id!=='C0BFZG5FBQD')fail('This viewer expects Friends of Jibe / #project-voltron.');
 for(const k of ['users','messages','files','events','raw_responses'])if(!Array.isArray(a[k]))fail(k+' must be an array.');
 if(!a.range||!/^\d{4}-\d{2}-\d{2}$/.test(a.range.start_date)||!/^\d{4}-\d{2}-\d{2}$/.test(a.range.end_date)||!(Date.parse(a.range.end_exclusive)>Date.parse(a.range.start)))fail('Invalid archive date range.');
 if(!a.coverage||!['complete','partial','failed'].includes(a.coverage.status)||!Array.isArray(a.coverage.limitations)||!Array.isArray(a.coverage.errors))fail('Missing coverage report.');
 const ids=new Set();
 for(const m of a.messages){if(!m||typeof m.ts!=='string'||!/^\d{1,12}\.\d{1,12}$/.test(m.ts)||typeof m.text!=='string')fail('Each message needs an exact string ts and text.');if(ids.has(m.ts))fail('Duplicate message ts '+m.ts);ids.add(m.ts);if(m.thread_ts!=null&&(typeof m.thread_ts!=='string'||!/^\d{1,12}\.\d{1,12}$/.test(m.thread_ts)))fail('Invalid thread_ts.');for(const k of ['blocks','attachments','files','reactions'])if(!Array.isArray(m[k]))fail('Message '+m.ts+': '+k+' must be an array.');for(const r of m.reactions)if(!r||typeof r.name!=='string'||!Number.isInteger(r.count)||r.count<0)fail('Invalid reaction.');for(const f of m.files)if(!f||typeof f!=='object'||typeof f.id!=='string')fail('Invalid message file.');for(const r of m.attachments)if(!r||typeof r!=='object')fail('Invalid attachment.');}
 for(const key of ['users','files'])for(const x of a[key])if(!x||typeof x.id!=='string')fail(key+' records require an id.');
 return a;
}
function mergeArchives(archives){const messages=new Map(),users=new Map(),files=new Map();for(const a of [...archives].sort((a,b)=>Date.parse(a.exported_at)-Date.parse(b.exported_at)||a.archive_id.localeCompare(b.archive_id))){for(const u of a.users)users.set(u.id,u);for(const f of a.files)files.set(f.id,f);for(const m of a.messages)messages.set(m.ts,m);}return{messages:[...messages.values()].sort((a,b)=>timestampCompare(a.ts,b.ts)),users,files};}

const time=ts=>date(ts).toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'});

const emoji={thumbsup:'👍','+1':'👍',heart:'❤️',joy:'😂',laughing:'😆',fire:'🔥',eyes:'👀',rocket:'🚀',white_check_mark:'✅',tada:'🎉',thinking_face:'🤔',100:'💯',wave:'👋',sunglasses:'😎',pray:'🙏'};

function link(u,label){const v=safeURL(u);return v?`<a href="${esc(v)}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">${esc(label||u)}</a>`:esc(label||u)}
function rich(text){const tokens=[];const put=s=>{tokens.push(s);return '\u0000'+(tokens.length-1)+'\u0000'};let s=String(text).replace(/\u0000/g,'');s=s.replace(/```([\s\S]*?)```/g,(_,x)=>put('<pre><code>'+esc(x)+'</code></pre>')).replace(/`([^`\n]+)`/g,(_,x)=>put('<code>'+esc(x)+'</code>')).replace(/<@([A-Z0-9]+)(?:\|[^>]*)?>/g,(_,id)=>put('<b>@'+esc(name({user_id:id}))+'</b>')).replace(/<#([A-Z0-9]+)(?:\|([^>]+))?>/g,(_,id,n)=>put('<b>#'+esc(n||id)+'</b>')).replace(/<(https?:[^>|]+)(?:\|([^>]*))?>/g,(_,u,l)=>put(link(u,l))).replace(/https?:\/\/[^\s<>\u0000]+/g,u=>put(link(u,u)));
 s=esc(s).replace(/&amp;(amp|lt|gt);/g,'&$1;').replace(/\*([^*\n]+)\*/g,'<strong>$1</strong>').replace(/(^|\s)_([^_\n]+)_(?=\s|$)/g,'$1<em>$2</em>').replace(/~([^~\n]+)~/g,'<s>$1</s>').replace(/:([a-z0-9_+-]+):/g,(all,n)=>emoji[n]||all).replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>tokens[Number(i)]);}

function rebuild(){data=mergeArchives(chosen());const prev=$('person').value;const authors=new Map(data.messages.map(m=>[m.user_id||m.bot_id||m.author_name||'',name(m)]));$('person').innerHTML='<option value="">All people</option>'+[...authors].sort((a,b)=>a[1].localeCompare(b[1])).map(([id,n])=>`<option value="${esc(id)}">${esc(n)}</option>`).join('');$('person').value=prev;render()}

function fileCard(f){f={...data.files.get(f.id),...f};const url=f.permalink||f.url_private||f.url_private_download;return `<div class="fileCard"><span class="fileIcon">▤</span><div>${url?link(url,f.title||f.name||f.id):esc(f.title||f.name||f.id)}<small>${esc(f.mimetype||f.filetype||'Attachment')} ${f.size?' · '+Math.ceil(f.size/1024)+' KB':''} · ${esc(f.download_status||'Linked file; Slack access may be required')}</small></div></div>`}
function message(m,inThread=false){const n=name(m),initials=n.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase(),h=[...n].reduce((v,c)=>v+c.charCodeAt(0),0)%360;const replies=data.messages.filter(x=>x.thread_ts===m.ts&&x.ts!==m.ts);const parent=m.thread_ts&&m.thread_ts!==m.ts;
 return `<article class="message"><div class="avatar" style="background:hsl(${h},25%,44%)">${esc(initials)}</div><div class="messageBody"><span class="author">${esc(n)}</span><span class="time" title="${esc(date(m.ts).toLocaleString('en-US',{timeZone:TZ}))} New York">${esc(time(m.ts))}</span>${m.edited?'<span class="time">(edited)</span>':''}${m.is_context?'<span class="time">context</span>':''}<div class="messageText">${rich(m.text)}</div>${m.attachments.map(a=>`<div class="attachment">${a.title?(a.title_link?link(a.title_link,a.title):'<b>'+esc(a.title)+'</b>'):''}${a.text?'<div>'+rich(a.text)+'</div>':(!a.title?esc(a.fallback||'Attachment metadata available in ⋯'):'')}${Array.isArray(a.fields)?a.fields.map(f=>'<div><b>'+esc(f.title)+'</b> '+esc(f.value)+'</div>').join(''):''}</div>`).join('')}${m.files.map(fileCard).join('')}${m.reactions.length?'<div class="reactions">'+m.reactions.map(r=>`<span class="reaction" title="${esc((r.users||[]).map(id=>name({user_id:id})).join(', ')||r.name+' · reactors unavailable')}">${esc(glyph(r.name))} ${r.count}</span>`).join('')+'</div>':''}${!inThread&&(replies.length||m.reply_count||parent)?`<button class="replies" data-thread="${esc(parent?m.thread_ts:m.ts)}">${parent?'↳ View thread':replies.length+' archived '+(replies.length===1?'reply':'replies')+(m.reply_count>replies.length?' · '+m.reply_count+' in Slack':'')} →</button>`:''}</div><button class="metadataBtn" data-meta="${esc(m.ts)}" title="View message metadata">⋯</button></article>`}
function empty(){return `<section class="empty"><div class="emptyIcon">#</div><div class="eyebrow">THE PROJECT VOLTRON ARCHIVE</div><h2>Good conversations.<br>A longer memory.</h2><p>Bring your channel history back to life.<br>Import a weekly JSON archive to browse messages,<br>follow threads, and find that one thing someone said.</p><button class="primary" data-import>↥ &nbsp; Import your first archive</button><button class="secondary" id="demoButton">Explore with a sample conversation →</button><p class="hint">Drop one or more .json files anywhere.<br>Your archives stay on this device.</p></section>`}
